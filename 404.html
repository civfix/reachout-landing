<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />
  <meta name="description" content="reach out la" />
  <title>404 &mdash; reach out la</title>

  <!--
    A known section requested with a trailing slash or extra path (e.g. /about/)
    falls through to this 404.html on Cloudflare Pages. Bounce it to the canonical
    clean URL, which the matching per-route file serves with HTTP 200. Genuinely
    unknown paths don't match and render the 404 below. Runs before paint, so no
    flash. /about is served by about.html (no redirect there) so there's no loop.
  -->
  <script>
    (function () {
      var ROUTES = { about: 1, mission: 1, civfix: 1, help: 1 };
      var seg = (location.pathname || '/').replace(/^\/+|\/+$/g, '').split('/')[0].toLowerCase();
      if (ROUTES[seg]) location.replace('/' + seg);
    })();
  </script>

    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap');

    :root {
      --paper:     #FBF7F0;  /* reach-out on-theme background */
      --bb-coral:  #ff6361;
      --bb-orange: #fda006;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      -webkit-text-size-adjust: none;
      text-size-adjust: none;
    }

    body {
      position: fixed;
      overflow: hidden;
      background: var(--paper);
      font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Same subtle corner wash the rest of the site uses, so the paper isn't flat. */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(1200px 700px at 78% -10%, rgba(255, 99, 97, 0.05), transparent 60%),
        radial-gradient(1000px 700px at 10% 110%, rgba(105, 206, 250, 0.06), transparent 60%);
    }

    .logo {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      width: 73%;
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .char {
      display: inline-block;
      vertical-align: middle;
      height: clamp(76px, 16vw, 130px);
      width: auto;
      padding: 0 clamp(4px, 1vw, 10px);
      transform-origin: center;
      opacity: 0;
      will-change: transform, opacity;
    }

    .social {
      position: absolute;
      left: 0;
      bottom: 18px;
      z-index: 1;
      width: 100%;
      text-align: center;
    }

    .link {
      display: inline-block;
      transform-origin: center;
      transform: translateY(100px) rotate(-180deg);
    }

    a:link,
    a:active,
    a:visited {
      position: relative;
      text-decoration: none;
      font-size: 12pt;
      font-weight: 600;
      padding: 0 5px;
      color: var(--bb-coral);
      transition: color 0.2s ease-out;
    }

    a:hover { color: var(--bb-orange); }
  </style>
</head>

  <script src="/vendor/gsap.min.js"></script>
  <script>
    // Animation ported from bongbong.com/404 (letters fall in, spin, elastic-settle,
    // then react to the cursor). Unchanged except for the safety guard below.
    const charData = [];

    window.onresize = function () {
      document.body.height = window.innerHeight;

      charData.forEach(function (data) {
        const bounds = data.element.getBoundingClientRect();
        data.pageX = bounds.left + bounds.width / 2;
        data.pageY = bounds.top + bounds.height / 2;
        data.width = bounds.width;
        data.height = bounds.height;
      });
    };

    const init = () => {
      const chars = document.querySelectorAll('.char');
      const links = document.querySelectorAll('.link');

      // If GSAP failed to load or the visitor prefers reduced motion, skip the
      // animation entirely and just reveal everything — never leave it blank.
      const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!window.gsap || reduceMotion) {
        chars.forEach(function (c) { c.style.opacity = 1; });
        links.forEach(function (l) { l.style.transform = 'none'; });
        return;
      }

      const durationScalar = 1.25;
      const input = {
        x: window.innerWidth / 2,
        y: window.innerHeight / 2,
        lastX: window.innerWidth / 2,
        lastY: window.innerHeight / 2
      };
      const amplitude = 10;
      let delay = 0;
      let tl;

      const transitionIn = () => {
        chars.forEach((char, index) => {
          if (index < chars.length - 1) {
            tl = gsap.timeline();
          } else {
            tl = gsap.timeline({
              onComplete: () => {
                window.onresize();
                update();
              }
            });
          }

          const bounds = char.getBoundingClientRect();
          charData.push({
            element: char,
            x: 0,
            y: 0,
            targetX: 0,
            targetY: 0,
            pageX: bounds.left + bounds.width / 2,
            pageY: bounds.top + bounds.height / 2,
            width: bounds.width,
            height: bounds.height,
            vx: 0,
            vy: 0
          });

          const scalar = Math.random() < 0.5 ? -1 : 1;

          tl.fromTo(
            char,
            {
              y: -window.innerHeight / 2,
              opacity: 0,
              scale: 0.5,
              rotation: 360 * scalar
            },
            {
              y: window.innerHeight / 2,
              opacity: 1,
              scale: 1,
              rotation: 180 * scalar,
              duration: 1 * durationScalar,
              ease: 'power3.in',
              delay: delay
            }
          );

          tl.to(char, {
            y: 0,
            rotation: 0,
            duration: 2 * durationScalar,
            ease: 'elastic'
          });

          delay += 0.2;
        });

        gsap.to(links, {
          duration: 1.2,
          rotation: 0,
          y: 0,
          stagger: 0.1,
          ease: 'elastic',
          delay: delay + 0.4
        });
      };

      const distance = (x1, x2, y1, y2) => {
        const a = x1 - x2;
        const b = y1 - y2;
        return Math.sqrt(a * a + b * b);
      };

      const smoothstep = (min, max, value) => {
        const x = Math.max(0, Math.min(1, (value - min) / (max - min)));
        return x * x * (3 - 2 * x);
      };

      const update = () => {
        requestAnimationFrame(update);

        const velX = (input.x - input.lastX) * amplitude;
        const velY = (input.y - input.lastY) * amplitude;
        const friction = 0.7;

        charData.forEach((data, index) => {
          const dist = distance(input.x, data.pageX, input.y, data.pageY);
          const scalar = smoothstep(data.width + data.height, 0, dist) * 0.1;

          data.targetX = velX * scalar;
          data.targetY = velY * scalar;

          const dx = data.targetX - data.x * 0.1;
          const dy = data.targetY - data.y * 0.1;
          data.vx += dx;
          data.vy += dy;
          data.vx *= friction;
          data.vy *= friction;

          data.x += data.vx;
          data.y += data.vy;

          const r = Math.max(Math.min(180 * (data.x + data.y) * 0.0025, 270), -270);

          data.element.style.transform = `translate(${data.x}px, ${data.y}px) rotate(${r}deg)`;
        });

        input.lastX = input.x;
        input.lastY = input.y;
      };

      const handleMouseMove = e => {
        input.x = e.clientX;
        input.y = e.clientY;
      };

      const handleTouchMove = e => {
        const touch = e.changedTouches[0];
        input.x = touch.clientX;
        input.y = touch.clientY;
      };

      window.addEventListener('mousemove', handleMouseMove, false);
      window.addEventListener('touchmove', handleTouchMove, false);

      transitionIn();
    };

    document.addEventListener('DOMContentLoaded', init);
  </script>
